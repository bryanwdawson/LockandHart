<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pin Index — Japan Explorer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 20px; background: #fef9f3; color: #2a1f17; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6e5a44; font-size: 13px; margin-bottom: 14px; }
  .sub b { color: #2a1f17; }
  #search { width: 100%; max-width: 420px; padding: 9px 13px; font-size: 14px; border: 1px solid #ead9bf; border-radius: 6px; margin-bottom: 12px; }
  .legend { font-size: 12px; color: #6e5a44; margin-bottom: 10px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-weight: 700; font-size: 11px; }
  .heavy { background: #fde0da; color: #b83a25; }
  .light { background: #faecc9; color: #9a6c12; }
  table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 2px 10px rgba(42,31,23,0.07); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 14px; border-bottom: 1px solid #f0e3cc; font-size: 13px; }
  th { cursor: pointer; user-select: none; background: #fff8ec; position: sticky; top: 0; font-size: 12px; letter-spacing: .3px; }
  th:hover { background: #fde8c8; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fff8ec; }
  a { color: #b83a25; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .num { text-align: right; font-variant-numeric: tabular-nums; width: 60px; }
  .muted { color: #a89a85; }
  .id { color: #6e5a44; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>Pin Index — Japan Explorer</h1>
<div class="sub">Click a title to open it in the explorer · click a column header to sort · <span id="meta"></span></div>
<div class="legend">
  <span class="chip heavy">heavy</span> 20+ photos (split candidate) &nbsp;&nbsp;
  <span class="chip light">light</span> under 3 photos
</div>
<input id="search" type="search" placeholder="Search by id or title…" autofocus>
<table>
  <thead><tr>
    <th data-k="photos">PHOTOS</th>
    <th data-k="cards">CARDS</th>
    <th data-k="type">TYPE</th>
    <th data-k="id">ID</th>
    <th data-k="title">TITLE</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
  let pins = [], sortKey = 'photos', sortDir = -1;
  fetch('pins.json')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      pins = (d.pins || []).map(function (p) {
        return {
          photos: (p.photos || []).length,
          cards: (p.extra_cards || []).length,
          type: p.type || '',
          id: p.id || '',
          title: p.title || ''
        };
      });
      var slots = pins.reduce(function (s, p) { return s + p.photos; }, 0);
      document.getElementById('meta').innerHTML = '<b>' + pins.length + '</b> pins · <b>' + slots + '</b> photo slots';
      render();
    })
    .catch(function () {
      document.getElementById('rows').innerHTML = '<tr><td colspan="5">Could not load pins.json — open this page through the local preview server (RUN-ME-preview-japan.bat), not as a file.</td></tr>';
    });

  function render() {
    var q = document.getElementById('search').value.toLowerCase();
    var rows = pins.filter(function (p) {
      return p.id.toLowerCase().indexOf(q) > -1 || p.title.toLowerCase().indexOf(q) > -1;
    });
    rows.sort(function (a, b) {
      var av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'string') return sortDir * av.localeCompare(bv);
      return sortDir * (av - bv);
    });
    document.getElementById('rows').innerHTML = rows.map(function (p) {
      var pcClass = p.photos >= 20 ? 'heavy' : (p.photos < 3 ? 'light' : '');
      var photoCell = pcClass
        ? '<span class="chip ' + pcClass + '">' + p.photos + '</span>'
        : p.photos;
      return '<tr>' +
        '<td class="num">' + photoCell + '</td>' +
        '<td class="num muted">' + p.cards + '</td>' +
        '<td class="muted">' + p.type + '</td>' +
        '<td class="id">' + p.id + '</td>' +
        '<td><a href="index.html#pin=' + encodeURIComponent(p.id) + '" target="_blank">' + p.title + '</a></td>' +
        '</tr>';
    }).join('');
  }

  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('th').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.dataset.k;
      if (sortKey === k) { sortDir = sortDir * -1; }
      else { sortKey = k; sortDir = (k === 'photos' || k === 'cards') ? -1 : 1; }
      render();
    });
  });
</script>
</body>
</html>
