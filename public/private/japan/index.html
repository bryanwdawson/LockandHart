<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A private interactive trip recap of Japan — April 2026.">
<title>Japan — April 2026 · Bryan's Explorer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root {
    --bg: #fef9f3;
    --surface: #fff;
    --surface-alt: #fff8ec;
    --ink: #2a1f17;
    --ink-soft: #6e5a44;
    --ink-fade: #a89a85;
    --border: #ead9bf;
    --accent: #d8533b;
    --accent-dark: #b83a25;
    --accent-bg: #fde8c8;
    --route: #d8533b;
    --t-shrine: #c0392b;
    --t-food: #e67e22;
    --t-neighborhood: #2980b9;
    --t-hike: #27ae60;
    --t-landmark: #8e44ad;
    --t-shop: #e91e63;
    --t-transit: #34495e;
    --t-default: #6e5a44;
    --shadow: 0 4px 14px rgba(42,31,23,0.08);
    --shadow-lg: 0 12px 32px rgba(42,31,23,0.18);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    overflow: hidden;
  }
  a { color: var(--accent-dark); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* Skip link for keyboard users */
  .skip-link {
    position: absolute; top: -40px; left: 8px; background: var(--ink); color: var(--bg);
    padding: 8px 14px; border-radius: 4px; z-index: 9999; text-decoration: none;
  }
  .skip-link:focus { top: 8px; }

  /* App shell */
  .app {
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    height: 100%;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
  header .subtitle { font-size: 12px; opacity: 0.92; }
  header .stats { display: flex; gap: 6px; flex-wrap: wrap; }
  .stat-chip {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.32);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    color: inherit;
    transition: background 0.12s, transform 0.12s;
  }
  .stat-chip b { font-weight: 700; }
  button.stat-chip { font: inherit; cursor: pointer; }
  button.stat-chip:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }

  /* Gallery view */
  #gallery {
    position: absolute;
    inset: 0;
    background: var(--bg);
    overflow-y: auto;
    padding: 14px;
    z-index: 250;
  }
  #gallery[hidden] { display: none; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px;
  }
  .gallery-item {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 6px;
    cursor: zoom-in;
    background: var(--surface-alt);
    border: none;
    padding: 0;
  }
  .gallery-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
    display: block;
  }
  .gallery-item:hover img,
  .gallery-item:focus-visible img { transform: scale(1.05); }
  .gallery-item-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.72));
    color: #fff;
    padding: 18px 8px 6px;
    font-size: 11px;
    text-align: left;
    line-height: 1.3;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .gallery-item:hover .gallery-item-label,
  .gallery-item:focus-visible .gallery-item-label { opacity: 1; }
  .gallery-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .gallery-count {
    text-align: center;
    padding: 6px 0 14px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* Controls bar */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-fade);
    font-weight: 700;
    margin-right: 2px;
  }
  .pill {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    line-height: 1;
    transition: background 0.12s, border-color 0.12s;
  }
  .pill:hover { background: var(--accent-bg); }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .pill[disabled] { opacity: 0.55; cursor: not-allowed; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pill .count {
    background: rgba(0,0,0,0.08);
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .pill.active .count { background: rgba(255,255,255,0.25); }
  .pill .badge {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(0,0,0,0.1);
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: 2px;
  }

  /* Map area */
  .map-wrap { position: relative; overflow: hidden; }
  #map { width: 100%; height: 100%; background: #e6e0d0; }
  .leaflet-container { font-family: inherit; }
  .leaflet-popup-content-wrapper { border-radius: 8px; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.4; }
  .leaflet-popup-content b { color: var(--accent-dark); }

  /* Language toggle (Leaflet custom control) */
  .lang-toggle { display: flex; background: #fff; border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.4); overflow: hidden; }
  .lang-toggle button { border: 0; background: transparent; padding: 4px 8px; font: 11px/1 inherit; color: #555; cursor: pointer; }
  .lang-toggle button.active { background: var(--accent, #d8533b); color: #fff; }
  .lang-toggle button + button { border-left: 1px solid rgba(0,0,0,0.1); }

  /* Custom pin markers */
  .pin-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.25);
    transition: transform 0.15s;
  }
  .pin-dot.candidate { opacity: 0.5; border-style: dashed; }
  .leaflet-marker-icon:hover .pin-dot { transform: scale(1.25); }
  .leaflet-marker-icon.selected .pin-dot { transform: scale(1.35); box-shadow: 0 0 0 3px rgba(216,83,59,0.5), 0 4px 8px rgba(0,0,0,0.3); }

  /* Cluster styling */
  .marker-cluster div {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-family: inherit;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .marker-cluster {
    background: rgba(216, 83, 59, 0.25);
  }
  .marker-cluster span { line-height: 1; }

  /* Detail panel — slides in from right */
  .detail {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 420px;
    max-width: 92vw;
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    transform: translateX(105%);
    transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
    z-index: 500;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
  }
  .detail.open { transform: translateX(0); }
  .detail-close {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(6px);
    border: none;
    width: 100%;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .detail-close .back-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--accent-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center;
    gap: 6px;
    transition: background 0.12s, border-color 0.12s;
  }
  .detail-close .back-btn:hover { background: var(--accent-bg); border-color: var(--accent); }
  .detail-close .close-x {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    font-size: 18px;
  }
  .detail-close .close-x:hover { background: var(--accent-bg); color: var(--accent-dark); }

  .detail-hero {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    cursor: zoom-in;
    background: var(--surface-alt);
    display: block;
  }
  .detail-body { padding: 16px 20px 24px; padding-bottom: max(24px, env(safe-area-inset-bottom, 24px)); }
  .detail-meta-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    font-size: 11px;
  }
  .meta-chip {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .meta-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .meta-chip.candidate { background: #fff7e0; border-color: #f0d49a; color: #8a6a14; }
  .detail h2 {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
    margin: 0 0 4px;
    color: var(--ink);
  }
  .detail .place-sub {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 16px;
  }
  .detail .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 0 0 18px;
  }
  .detail .photo-grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    cursor: zoom-in;
    background: var(--surface-alt);
  }
  .narrative > * + * { margin-top: 12px; }
  .narrative h3 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin: 0;
  }
  .narrative p { margin: 0; line-height: 1.55; }
  .narrative .tip {
    background: var(--accent-bg);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 13px;
    color: #6a3a14;
  }
  .narrative .tip strong { color: var(--accent-dark); }

  /* Menu list — what was eaten / ordered. Optional pin.menu array. */
  .narrative .menu { display: flex; flex-direction: column; gap: 8px; }
  .narrative .menu-item { font-size: 13px; line-height: 1.5; }
  .narrative .menu-item .dish { font-weight: 600; color: var(--ink); }
  .narrative .menu-item .note { color: var(--ink-soft); }
  .narrative .menu-item .fact { color: var(--ink-soft); font-style: italic; display: block; margin-top: 2px; }

  /* Video embeds — YouTube Shorts (9:16) + regular YouTube videos (16:9). */
  .narrative .videos { display: flex; flex-direction: column; gap: 12px; }
  .narrative .video-item {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: #000;
  }
  .narrative .video-item .iframe-wrap {
    position: relative;
    width: 100%;
    background: #000;
  }
  .narrative .video-item.short .iframe-wrap {
    aspect-ratio: 9/16;
    max-width: 280px;
    margin: 0 auto;
  }
  .narrative .video-item.standard .iframe-wrap {
    aspect-ratio: 16/9;
  }
  .narrative .video-item iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .narrative .video-item .caption {
    font-size: 12px;
    color: var(--ink-soft);
    padding: 6px 10px;
    background: var(--surface-alt);
    border-top: 1px solid var(--border);
  }
  .narrative .videos-head {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* Extra context cards — optional pin.extra_cards array. */
  .narrative .context-card {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .narrative .context-card h4 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }
  .narrative .context-card p { font-size: 13px; line-height: 1.55; }
  .narrative .context-card + .context-card { margin-top: 8px; }
  .narrative .context-card .source {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    color: var(--accent-dark);
    text-decoration: underline;
  }

  /* Pin prev/next nav within a day (shown when a single day is filtered) */
  .day-pin-nav {
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: stretch;
    font-size: 12px;
  }
  .day-pin-nav .nav-btn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    line-height: 1.3;
    transition: background 0.12s, border-color 0.12s;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .day-pin-nav .nav-btn:hover { background: var(--accent-bg); border-color: var(--accent); }
  .day-pin-nav .nav-btn .label {
    font-size: 10px;
    color: var(--ink-fade);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .day-pin-nav .nav-btn .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day-pin-nav .nav-btn.right { text-align: right; align-items: flex-end; }
  .day-pin-nav .nav-btn[disabled] { opacity: 0.4; cursor: default; }
  .day-pin-nav .nav-btn[disabled]:hover { background: var(--surface-alt); border-color: var(--border); }
  .day-pin-nav .nav-pos {
    align-self: center;
    font-size: 11px;
    color: var(--ink-fade);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .tags-row { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 10px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .wiki-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--accent-dark);
    text-decoration: underline;
  }

  /* Timeline strip */
  .timeline {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    align-items: center;
    /* iOS Safari + body{overflow:hidden} parent: explicit pan-x lets the
       horizontal touch-scroll actually reach this child. Without it the
       day strip stops scrolling around day 5 on mobile. */
    touch-action: pan-x;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .day-pill { scroll-snap-align: start; }
  .timeline::-webkit-scrollbar { height: 6px; }
  .timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .timeline .row-label { white-space: nowrap; }
  .day-pill {
    flex-shrink: 0;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    min-width: 64px;
    text-align: center;
    font-size: 11px;
    transition: background 0.12s, border-color 0.12s, transform 0.12s;
  }
  .day-pill:hover { background: var(--accent-bg); }
  .day-pill.active { background: var(--accent); color: #fff; border-color: var(--accent-dark); }
  .day-pill .day-num { display: block; font-weight: 700; font-size: 12px; }
  .day-pill .day-date { display: block; font-size: 10px; color: var(--ink-fade); }
  .day-pill.active .day-date { color: rgba(255,255,255,0.85); }
  .day-pill .day-ct { display: block; font-size: 10px; margin-top: 2px; opacity: 0.85; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(20, 14, 10, 0.94);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .lightbox-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .lightbox-controls button {
    pointer-events: auto;
    position: absolute;
    background: rgba(0,0,0,0.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    width: 48px; height: 48px;
    font-size: 28px;
    line-height: 1;
    font-weight: 300;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .lightbox-controls button:hover { background: rgba(0,0,0,0.8); transform: scale(1.05); }
  .lightbox-close { top: 16px; right: 16px; }
  .lightbox-prev { left: 12px; top: 50%; transform: translateY(-50%); }
  .lightbox-prev:hover { transform: translateY(-50%) scale(1.05); }
  .lightbox-next { right: 12px; top: 50%; transform: translateY(-50%); }
  .lightbox-next:hover { transform: translateY(-50%) scale(1.05); }
  .lightbox-counter {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.95);
    font-size: 13px;
    font-weight: 600;
    background: rgba(0,0,0,0.6);
    padding: 6px 14px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  /* First-visit hint: shows for 3 seconds on first lightbox open per device */
  .lightbox-hint {
    position: absolute;
    bottom: 60px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 13px;
    background: rgba(0,0,0,0.65);
    padding: 10px 18px;
    border-radius: 999px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    max-width: 92vw;
    text-align: center;
  }
  .lightbox-hint.show { opacity: 1; }
  /* Mobile-only sizing */
  @media (max-width: 640px) {
    .lightbox-controls button { width: 52px; height: 52px; font-size: 32px; }
    .lightbox-prev { left: 8px; }
    .lightbox-next { right: 8px; }
    .lightbox { padding: 8px; }
  }

  /* Day photo-journey modal */
  .day-photos-modal {
    position: fixed; inset: 0;
    background: rgba(20,14,10,0.96);
    z-index: 9500;
    display: none;
    flex-direction: column;
  }
  .day-photos-modal.open { display: flex; }
  .day-photos-head {
    flex-shrink: 0;
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top, 14px));
    padding-left: max(18px, env(safe-area-inset-left, 18px));
    padding-right: max(18px, env(safe-area-inset-right, 18px));
    border-bottom: 1px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #fff;
    background: rgba(0,0,0,0.35);
  }
  .day-photos-head .title { font-size: 16px; font-weight: 600; }
  .day-photos-head .sub { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 400; margin-top: 2px; }
  .day-photos-head .close-x {

  .day-photos-grid {
    display: grid;

  }
  .day-photos-section + .day-photos-section { margin-top: 24px; }
  .day-photos-section-head {
    max-width: 1200px;
    margin: 0 auto 10px;
    display: flex;

    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.18);

  }
  .day-photos-section-head .name {
    color: #fff;

  .day-photos-section-head .time {
    color: rgba(255,255,255,0.6);

  .day-photos-section-head .type-dot {

    border-radius: 50%;
    flex-shrink: 0;

  .day-photos-item {
    position: relative;
    aspect-ratio: 1;

  .day-photos-item img {
    width: 100%; height: 100%;

  .day-photos-item:hover img { transform: scale(1.04); }
  .day-photos-item-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
    color: #fff;
    padding: 22px 8px 6px;
    font-size: 10px;
    text-align: left;
    line-height: 1.3;

  .day-photos-item:hover .day-photos-item-label,

  @media (max-width: 640px) {
    .day-photos-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .day-photos-head .title { font-size: 14px; }

    .day-photos-head .close-x { width: 44px; height: 44px; font-size: 22px; }
  }
  .day-photos-empty {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255,255,255,0.6);
  }

  /* "View day in photos" CTA inside the day-overview card */
  .day-journey-cta {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 8px 14px;
    background: var(--accent);
    color: #fff;

    border-radius: 6px;

  /* Day overview card */
  .day-overview {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;

    overflow-y: auto;
    -webkit-overflow-scrolling: touch;

  .day-overview.show { transform: translateY(0); }
  .day-overview[hidden] { display: none; }
  .day-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;

  .day-head-title {

  }
  .day-head-close {
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 50%; width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;

  .day-head-close:hover { background: var(--accent-bg); color: var(--accent-dark); }
  .day-overview { overflow-wrap: break-word; word-wrap: break-word; }
  .day-overview h3 { font-size: 17px; font-weight: 700; margin: 0 0 4px; line-height: 1.25; }
  .day-summary { font-size: 13px; line-height: 1.55; margin: 0 0 10px; color: var(--ink); }
  .day-quote {
    font-style: italic; color: var(--ink-soft);

  @media (max-width: 720px) {
    /* Full-screen takeover on mobile — explicit longhand to defeat the desktop
       absolute-positioning rules and the transform-induced containing-block quirk. */
    .day-overview {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* dynamic viewport — accounts for mobile URL bar */
      max-width: 100vw;
      max-height: 100dvh;

    .day-overview .day-head {

      background: var(--surface);
      padding-bottom: 8px;
      margin-left: -4px;
      margin-right: -4px;
      padding-left: 4px;
      padding-right: 4px;

    .day-head-close {
      width: 44px;
      height: 44px;

  }

  /* Empty state */
  .empty-state {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    text-align: center;
    box-shadow: var(--shadow);
    z-index: 400;
    max-width: 90%;
    display: none;
  }
  .empty-state.show { display: block; }
  .empty-state h3 { margin: 0 0 6px; font-size: 16px; }
  .empty-state p { margin: 0 0 12px; font-size: 13px; color: var(--ink-soft); }
  .empty-state button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
  }

  /* Loading state */
  .loading {
    position: absolute;
    inset: 0;
    background: var(--bg);

  .loading.hide { opacity: 0; pointer-events: none; }
  .loading .spinner {

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {

  /* Route line */
  .route-line {

  /* Mobile */
  @media (max-width: 720px) {

    header h1 { font-size: 16px; }
    header .stats { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
    .stat-chip { font-size: 10px; padding: 3px 8px; }
    .controls { padding: 6px 8px; gap: 6px; }
    .row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .row::-webkit-scrollbar { display: none; }
    .pill { padding: 6px 10px; font-size: 11px; min-height: 36px; }
    /* Full-screen takeover on mobile — explicit longhand for compatibility. */
    .detail {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      z-index: 9000;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .day-pill { min-width: 56px; padding: 5px 8px; }
  }
</style>

<div class="app">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<script>
(function () {
  'use strict';

  // ---------- Theme tokens (mirror CSS) ----------
  const TYPE_COLORS = {
    shrine: '#c0392b',
    food: '#e67e22',
    neighborhood: '#2980b9',
    hike: '#27ae60',
    landmark: '#8e44ad',
    shop: '#e91e63',
    transit: '#34495e',
    default: '#6e5a44',
  };

  // ---------- Trip day helpers ----------
  // Day 1 = 2026-04-18 (land day). Day 10 = 2026-04-27 (return).
  const TRIP_START = '2026-04-18';
  const TRIP_DAYS = 10;

  function dateToDay(dateStr) {
    if (!dateStr || dateStr === '?') return null;
    const start = new Date(TRIP_START + 'T00:00:00');
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return null;
    const diff = Math.round((d - start) / 86400000) + 1;
    return diff >= 1 && diff <= TRIP_DAYS ? diff : null;
  }

  // Parse "visited" field which can be:
  //   "2026-04-19"
  //   "2026-04-19, 2026-04-27"
  //   "2026-04-18 to 2026-04-27"
  //   "?"
  function pinDays(pin) {
    const v = (pin.visited || '').trim();
    if (!v || v === '?') return [];
    if (v.includes(' to ')) {
      const [a, b] = v.split(' to ').map((s) => s.trim());
      const da = dateToDay(a), db = dateToDay(b);
      if (da == null || db == null) return [];
      const out = [];
      for (let i = da; i <= db; i++) out.push(i);
      return out;
    }
    return v.split(',').map((s) => dateToDay(s.trim())).filter((x) => x != null);
  }

  function dayLabelDate(day) {
    const start = new Date(TRIP_START + 'T00:00:00');
    const d = new Date(start.getTime() + (day - 1) * 86400000);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // ---------- URL hash state ----------
  // Format: #filter=shrine&day=3&pin=ginza
  function parseHash() {
    const out = {};
    const h = location.hash.replace(/^#/, '');
    if (!h) return out;
    h.split('&').forEach((part) => {
      const [k, v] = part.split('=');
      if (k && v) out[k] = decodeURIComponent(v);
    });
    return out;
  }
  function writeHash(state) {
    const parts = [];
    if (state.filter && state.filter !== 'all') parts.push('filter=' + state.filter);
    if (state.day && state.day !== 'all') parts.push('day=' + state.day);
    if (state.mode && state.mode !== 'default') parts.push('mode=' + state.mode);
    if (state.pin) parts.push('pin=' + state.pin);
    const next = parts.length ? '#' + parts.join('&') : '';
    if (next !== location.hash) history.replaceState(null, '', location.pathname + next);
  }

  // ---------- State ----------
  const state = {
    pins: [],
    filter: 'all',
    day: 'all',
    pin: null,
    mode: 'default',
    routeOn: false,
    view: 'map',
  };
  let daysData = null;

  // ---------- DOM refs ----------
  const $ = (sel) => document.querySelector(sel);
  const els = {
    typeFilters: $('#type-filters'),
    timeline: $('#timeline'),
    routeToggle: $('#route-toggle'),
    closeDetail: $('#close-detail'),
    backToMap: $('#back-to-map'),
    lbHint: $('#lightbox-hint'),
    detail: $('#detail'),
    detailContent: $('#detail-content'),
    emptyState: $('#empty-state'),
    resetFilters: $('#reset-filters'),
    loading: $('#loading'),
    lightbox: $('#lightbox'),
    lbImg: $('#lightbox-img'),
    lbClose: $('#lightbox-close'),
    lbPrev: $('#lightbox-prev'),
    lbNext: $('#lightbox-next'),
    lbCounter: $('#lightbox-counter'),
  };

  // ---------- Map setup ----------
  const map = L.map('map', {
    center: [36.2, 138.0],
    zoom: 5,
    zoomControl: true,
    minZoom: 4,
    maxZoom: 18,
    worldCopyJump: false,
  });

  // Voyager labels-under (JP): Japanese labels rendered under roads — same realistic look as Voyager but less visually busy.
  // Positron (EN): Latin-script labels.
  // Off: tiles hidden — pins float on the cream map-wrap background.
  const TILE_SOURCES = {
    jp: {
      url: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png',
      opts: { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' },
    },
    en: {
      url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      opts: { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' },
    },
    off: null,
  };
  const LANG_KEY = 'jp-map-lang';
  let mapLang = localStorage.getItem(LANG_KEY) || 'jp';
  if (!(mapLang in TILE_SOURCES)) mapLang = 'jp';
  let tileLayer = null;

  function applyTileLayer() {
    if (tileLayer) { map.removeLayer(tileLayer); tileLayer = null; }
    const src = TILE_SOURCES[mapLang];
    if (src) tileLayer = L.tileLayer(src.url, src.opts).addTo(map);
  }
  applyTileLayer();

  function setMapLang(lang) {
    if (!(lang in TILE_SOURCES) || lang === mapLang) return;
    mapLang = lang;
    localStorage.setItem(LANG_KEY, lang);
    applyTileLayer();
    document.querySelectorAll('.lang-toggle button').forEach((b) => {
      const on = b.dataset.lang === lang;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }

  const LangControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'lang-toggle');
      const mk = (lang, label, title) =>
        `<button type="button" data-lang="${lang}" aria-pressed="${mapLang === lang}" class="${mapLang === lang ? 'active' : ''}" aria-label="${title}" title="${title}">${label}</button>`;
      div.innerHTML =
        mk('jp', '日本語', 'Japanese labels') +
        mk('en', 'EN', 'English labels') +
        mk('off', 'Off', 'Hide map, show pins only');
      L.DomEvent.disableClickPropagation(div);
      div.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-lang]');
        if (btn) setMapLang(btn.dataset.lang);
      });
      return div;
    },
  });
  map.addControl(new LangControl());

  const clusterGroup = L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 14,
    maxClusterRadius: 45,
    spiderfyDistanceMultiplier: 1.5,
  });
  map.addLayer(clusterGroup);

  const markerIndex = new Map(); // pin.id -> marker
  let routeLayer = null;

  function makeIcon(pin) {
    const color = TYPE_COLORS[pin.type] || TYPE_COLORS.default;
    const statusClass = pin.status === 'candidate' ? ' candidate' : '';
    return L.divIcon({
      className: 'pin-marker',
      html: `<div class="pin-dot${statusClass}" style="background:${color}" role="img" aria-label="${escapeHtml(pin.title)}"></div>`,
      iconSize: [24, 24],
      iconAnchor: [12, 12],
    });
  }

  // ---------- Render markers ----------
  function buildMarkers() {
    clusterGroup.clearLayers();
    markerIndex.clear();
    const visible = filteredPins();

    visible.forEach((pin) => {
      if (!pin.coords || pin.coords.length !== 2) return;
      const marker = L.marker([pin.coords[0], pin.coords[1]], {
        icon: makeIcon(pin),
        title: pin.title,
        keyboard: true,
        riseOnHover: true,
        alt: pin.title,
      });
      marker.bindTooltip(pin.title, { direction: 'top', offset: [0, -8] });
      marker.on('click', () => openDetail(pin.id));
      marker.on('keypress', (e) => { if (e.originalEvent.key === 'Enter') openDetail(pin.id); });
      clusterGroup.addLayer(marker);
      markerIndex.set(pin.id, marker);
    });

    // Empty state
    els.emptyState.classList.toggle('show', visible.length === 0);

    // Route line
    drawRoute();

    // Fit bounds to visible (when filtered)
    if (visible.length > 0 && (state.filter !== 'all' || state.day !== 'all')) {
      const bounds = L.latLngBounds(visible.filter(p => p.coords).map((p) => p.coords));
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
    }

    // Rebuild gallery (no-op visually when not in gallery view, just keeps DOM ready)
    if (state.view === 'gallery') renderGallery();
  }

  // Mode filters layer ON TOP of type/day filters. Default = pass-through.
  // Modes are driven by day themes (from days.json) — each mode shows pins visited
  // on at least one day tagged with that theme. Falls back to tag matching when
  // days.json isn't loaded yet.
  function pinHasTheme(pin, theme) {
    if (!daysData) return false;
    const days = pinDays(pin);
    if (!days.length) return false;
    return days.some((d) => {
      const day = daysData.days.find((x) => x.day === d);
      return day && (day.themes || []).includes(theme);
    });
  }
  const WORK_TAGS = new Set(['work', 'government', 'client-dinner', 'team', 'team-dinner', 'kaiseki']);
  const MODE_FILTERS = {
    default: () => true,
    work: (pin) => pinHasTheme(pin, 'work') || (pin.tags || []).some((t) => WORK_TAGS.has(t)),
    spiritual: (pin) => pinHasTheme(pin, 'spiritual') || pin.type === 'shrine',
    cultural: (pin) => pinHasTheme(pin, 'cultural'),
    comedy: (pin) => pinHasTheme(pin, 'comedy'),
  };

  function filteredPins() {
    const modeFn = MODE_FILTERS[state.mode] || MODE_FILTERS.default;
    return state.pins.filter((pin) => {
      if (!modeFn(pin)) return false;
      if (state.filter !== 'all' && pin.type !== state.filter) return false;
      if (state.day !== 'all') {
        const days = pinDays(pin);
        if (!days.includes(parseInt(state.day, 10))) return false;
      }
      return true;
    });
  }

  // ---------- Route line ----------
  function drawRoute() {
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    if (!state.routeOn) return;

    // Order pins by first day visited (or rank candidates last)
    const ordered = filteredPins()
      .filter((p) => p.coords)
      .map((p) => ({ p, day: pinDays(p)[0] ?? 99 }))
      .sort((a, b) => a.day - b.day)
      .map((x) => x.p);

    if (ordered.length < 2) return;
    const latlngs = ordered.map((p) => p.coords);
    routeLayer = L.polyline(latlngs, {
      className: 'route-line',
      color: TYPE_COLORS.shrine,
      weight: 2,
      dashArray: '4 6',
      opacity: 0.55,
      interactive: false,
    }).addTo(map);
  }

  // ---------- Detail panel ----------
  function openDetail(pinId, opts) {
    opts = opts || {};
    const pin = state.pins.find((p) => p.id === pinId);
    if (!pin) return;
    state.pin = pinId;
    writeHash(state);

    els.detail.classList.add('open');
    els.detail.setAttribute('aria-hidden', 'false');
    els.detailContent.innerHTML = detailHtml(pin);
    els.detailContent.scrollTop = 0;
    bindDetailEvents(pin);

    // Pan (and zoom when coming from a direct link) to the pin.
    // On mobile the detail panel covers the full screen — the pan happens
    // behind the panel so when the user closes the detail, the pin is centered
    // and ready for the next interaction. On desktop, offset the pan so the
    // pin sits to the left of the 420px detail panel.
    const isMobile = window.innerWidth <= 720;
    if (pin.coords && !opts.skipPan) {
      const offset = isMobile ? 0 : -210;
      if (opts.fromHash) {
        const zoom = Math.max(map.getZoom(), 14);
        const target = map.project(pin.coords, zoom).add([offset, 0]);
        map.flyTo(map.unproject(target, zoom), zoom, { animate: true, duration: 0.8 });
      } else if (isMobile) {
        // Panel covers the screen; skip the animation since it's invisible.
        const target = map.project(pin.coords).add([offset, 0]);
        map.panTo(map.unproject(target), { animate: false });
      } else {
        const target = map.project(pin.coords).add([offset, 0]);
        map.panTo(map.unproject(target), { animate: true });
      }
    }
  }

  function closeDetail() {
    els.detail.classList.remove('open');
    els.detail.setAttribute('aria-hidden', 'true');
    state.pin = null;
    writeHash(state);
  }

  function detailHtml(pin) {
    const typeColor = TYPE_COLORS[pin.type] || TYPE_COLORS.default;
    const days = pinDays(pin);
    const visited = pin.visited && pin.visited !== '?'
      ? humanVisited(pin.visited)
      : 'Date uncertain';
    const photos = (pin.photos || []).slice();
    const hero = pin.hero || photos[0];
    const heroIdx = hero && photos.indexOf(hero) >= 0 ? photos.indexOf(hero) : 0;

    return `
      ${hero ? `<img class="detail-hero" src="photos/${escapeAttr(hero)}" alt="${escapeAttr(pin.title)}" loading="lazy" data-photo-idx="${heroIdx}" data-pin="${escapeAttr(pin.id)}">` : ''}
      <div class="detail-body">
        <div class="detail-meta-row">
          <span class="meta-chip"><span class="dot" style="background:${typeColor};"></span>${prettyType(pin.type)}</span>
          ${pin.status === 'candidate' ? '<span class="meta-chip candidate">Candidate · not photo-confirmed</span>' : ''}
          <span class="meta-chip">${escapeHtml(visited)}</span>
          ${days.length ? `<span class="meta-chip">Day ${days.join(', ')}</span>` : ''}
        </div>
        <h2>${escapeHtml(pin.title)}</h2>
        <p class="place-sub">${escapeHtml(pin.city || '')}${pin.neighborhood && pin.neighborhood !== 'TBD' ? ' · ' + escapeHtml(pin.neighborhood) : ''}</p>

        ${photos.length > 1 ? `
          <div class="photo-grid" role="list">
            ${photos.slice(0, 9).map((ph, i) => `
              <img src="photos/${escapeAttr(ph)}" alt="${escapeAttr(pin.title)} — photo ${i + 1}" loading="lazy" data-photo-idx="${i}" data-pin="${escapeAttr(pin.id)}" role="listitem">
            `).join('')}
          </div>
        ` : ''}

        <div class="narrative">
          ${factsHtml(pin.facts || {})}
          ${menuHtml(pin.menu)}
          ${videosHtml(pin.videos)}
          ${extraCardsHtml(pin.extra_cards)}
          ${pin.wiki ? `<a class="wiki-link" href="${escapeAttr(pin.wiki)}" target="_blank" rel="noreferrer">Read on Wikipedia ↗</a>` : ''}
          ${(pin.tags || []).length ? `
            <div class="tags-row">${pin.tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
          ` : ''}
          ${dayPinNavHtml(pin)}
        </div>
      </div>
    `;
  }

  // Chronologically ordered pins for a given day (by first photo's timestamp; fallback to first appearance).
  function dayPinsOrdered(dayNum) {
    const pins = state.pins.filter((p) => pinDays(p).includes(dayNum));
    pins.forEach((p) => {
      const first = (p.photos || [])[0];
      p.__sortTime = first ? parsePhotoTime(first) : Number.MAX_SAFE_INTEGER;
    });
    pins.sort((a, b) => (a.__sortTime || 0) - (b.__sortTime || 0));
    pins.forEach((p) => delete p.__sortTime);
    return pins;
  }

  function dayPinNavHtml(pin) {
    if (state.day === 'all') return '';
    const dayNum = parseInt(state.day, 10);
    if (!pinDays(pin).includes(dayNum)) return '';
    const ordered = dayPinsOrdered(dayNum);
    if (ordered.length < 2) return '';
    const idx = ordered.findIndex((p) => p.id === pin.id);
    const prev = idx > 0 ? ordered[idx - 1] : null;
    const next = idx < ordered.length - 1 ? ordered[idx + 1] : null;
    return `
      <nav class="day-pin-nav" aria-label="Other pins on Day ${dayNum}">
        ${prev ? `
          <button class="nav-btn" data-pin-nav="${escapeAttr(prev.id)}" aria-label="Previous pin: ${escapeAttr(prev.title)}">
            <span class="label">‹ Prev</span>
            <span class="title">${escapeHtml(prev.title)}</span>
          </button>
        ` : `<button class="nav-btn" disabled><span class="label">‹ Prev</span><span class="title">First</span></button>`}
        <span class="nav-pos">${idx + 1} / ${ordered.length}</span>
        ${next ? `
          <button class="nav-btn right" data-pin-nav="${escapeAttr(next.id)}" aria-label="Next pin: ${escapeAttr(next.title)}">
            <span class="label">Next ›</span>
            <span class="title">${escapeHtml(next.title)}</span>
          </button>
        ` : `<button class="nav-btn right" disabled><span class="label">Next ›</span><span class="title">Last</span></button>`}
      </nav>
    `;
  }

  // Merge facts into a narrative. Order matters — story first, tip last.
  const FACT_LABELS = {
    history: 'History',
    deity: 'Deity',
    ritual: 'Ritual',
    symbol: 'Symbol',
    wow: 'Did you know',
    kid: 'Fun fact',
    food: 'Food',
    local: 'Local insight',
    tip: 'Tip',
  };
  const FACT_ORDER = ['history', 'deity', 'ritual', 'symbol', 'wow', 'kid', 'food', 'local', 'tip'];

  function factsHtml(facts) {
    const items = [];
    FACT_ORDER.forEach((k) => {
      const val = facts[k];
      if (!val) return;
      if (k === 'tip') {
        items.push(`<div class="tip"><strong>${FACT_LABELS[k]}.</strong> ${escapeHtml(val)}</div>`);
      } else {
        items.push(`
          <div>
            <h3>${FACT_LABELS[k]}</h3>
            <p>${escapeHtml(val)}</p>
          </div>
        `);
      }
    });
    return items.join('');
  }

  // Menu items: optional pin.menu = [{ name, note?, fact? }, ...]
  function menuHtml(menu) {
    if (!Array.isArray(menu) || !menu.length) return '';
    const items = menu.map((m) => {
      const note = m.note ? ` — ${escapeHtml(m.note)}` : '';
      const fact = m.fact ? `<span class="fact">${escapeHtml(m.fact)}</span>` : '';
      return `<div class="menu-item"><span class="dish">${escapeHtml(m.name || '')}</span><span class="note">${note}</span>${fact}</div>`;
    }).join('');
    return `<div><h3>Menu</h3><div class="menu">${items}</div></div>`;
  }

  // Videos: optional pin.videos = [{ id, kind, title }, ...]
  // kind: "short" (9:16) or "standard" (16:9, default if absent)
  function videosHtml(videos) {
    if (!Array.isArray(videos) || !videos.length) return '';
    const items = videos.map((v) => {
      const id = v.id || '';
      if (!id) return '';
      const kind = v.kind === 'short' ? 'short' : 'standard';
      const title = v.title || '';
      const src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0`;
      return `
        <div class="video-item ${kind}">
          <div class="iframe-wrap">
            <iframe src="${src}" title="${escapeAttr(title)}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          ${title ? `<div class="caption">${escapeHtml(title)}</div>` : ''}
        </div>
      `;
    }).join('');
    return `<div><h3 class="videos-head">Videos</h3><div class="videos">${items}</div></div>`;
  }

  // Extra context cards: optional pin.extra_cards = [{ title, body, source? }, ...]
  function extraCardsHtml(cards) {
    if (!Array.isArray(cards) || !cards.length) return '';
    return cards.map((c) => `
      <div class="context-card">
        ${c.title ? `<h4>${escapeHtml(c.title)}</h4>` : ''}
        ${c.body ? `<p>${escapeHtml(c.body)}</p>` : ''}
        ${c.source ? `<a class="source" href="${escapeAttr(c.source)}" target="_blank" rel="noreferrer">Source ↗</a>` : ''}
      </div>
    `).join('');
  }

  function bindDetailEvents(pin) {
    const imgs = els.detailContent.querySelectorAll('img[data-photo-idx]');
    imgs.forEach((img) => {
      img.addEventListener('click', () => {
        const idx = parseInt(img.getAttribute('data-photo-idx'), 10);
        openLightbox(pin, idx);
      });
    });
    els.detailContent.querySelectorAll('button[data-pin-nav]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-pin-nav');
        if (targetId) openDetail(targetId);
      });
    });
  }

  function humanVisited(s) {
    if (s.includes(' to ')) {
      const [a, b] = s.split(' to ');
      return `${formatDate(a)} → ${formatDate(b)}`;
    }
    return s.split(',').map((d) => formatDate(d.trim())).join(' · ');
  }
  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function prettyType(t) {
    const m = { shrine: 'Shrine', food: 'Food', neighborhood: 'Area', hike: 'Hike', landmark: 'Landmark', shop: 'Shop', transit: 'Transit' };
    return m[t] || t;
  }

  // ---------- Lightbox ----------
  let lbState = { pin: null, idx: 0, photos: [], lastFocus: null };
  function openLightbox(pin, idx) {
    lbState.pin = pin;
    lbState.photos = pin.photos || [];
    lbState.idx = Math.max(0, Math.min(idx, lbState.photos.length - 1));
    lbState.lastFocus = document.activeElement;
    renderLightbox();
    els.lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    els.lbClose.focus();
    if (lbState.photos.length > 1) maybeShowHint();
  }
  function closeLightbox() {
    els.lightbox.classList.remove('open');
    document.body.style.overflow = '';
    if (lbState.lastFocus && lbState.lastFocus.focus) lbState.lastFocus.focus();
  }
  function renderLightbox() {
    const ph = lbState.photos[lbState.idx];
    if (!ph) return;
    els.lbImg.src = 'photos/' + ph;
    els.lbImg.alt = `${lbState.pin.title} — photo ${lbState.idx + 1} of ${lbState.photos.length}`;
    els.lbCounter.textContent = `${lbState.idx + 1} / ${lbState.photos.length}`;
    const single = lbState.photos.length <= 1;
    els.lbPrev.style.display = single ? 'none' : '';
    els.lbNext.style.display = single ? 'none' : '';
  }
  function lbNav(delta) {
    if (!lbState.photos.length) return;
    lbState.idx = (lbState.idx + delta + lbState.photos.length) % lbState.photos.length;
    renderLightbox();
  }

  // ---------- Filter & day handlers ----------
  function bindFilters() {
    els.typeFilters.querySelectorAll('button[data-filter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.filter = btn.dataset.filter;
        els.typeFilters.querySelectorAll('button[data-filter]').forEach((b) => {
          const on = b === btn;
          b.classList.toggle('active', on);
          b.setAttribute('aria-pressed', on);
        });
        writeHash(state);
        buildMarkers();
      });
    });

    els.routeToggle.addEventListener('click', () => {
      state.routeOn = !state.routeOn;
      els.routeToggle.classList.toggle('active', state.routeOn);
      els.routeToggle.setAttribute('aria-pressed', state.routeOn);
      drawRoute();
    });

    els.resetFilters.addEventListener('click', () => {
      state.filter = 'all';
      state.day = 'all';
      writeHash(state);
      refreshUI();
      buildMarkers();
    });

    const surpriseBtn = document.getElementById('surprise-me');
    if (surpriseBtn) {
      surpriseBtn.addEventListener('click', () => {
        const candidates = filteredPins().filter((p) => p.coords);
        if (!candidates.length) return;
        const pick = candidates[Math.floor(Math.random() * candidates.length)];
        openDetail(pick.id);
      });
    }
  }

  function buildTimeline() {
    for (let day = 1; day <= TRIP_DAYS; day++) {
      const btn = document.createElement('button');
      btn.className = 'day-pill';
      btn.dataset.day = String(day);
      const count = state.pins.filter((p) => pinDays(p).includes(day)).length;
      btn.innerHTML = `<span class="day-num">Day ${day}</span><span class="day-date">${dayLabelDate(day)}</span><span class="day-ct">${count} pin${count === 1 ? '' : 's'}</span>`;
      btn.addEventListener('click', () => setDay(String(day)));
      els.timeline.appendChild(btn);
    }
    els.timeline.querySelector('[data-day="all"]').addEventListener('click', () => setDay('all'));
  }

  function setDay(day) {
    state.day = day;
    els.timeline.querySelectorAll('button[data-day]').forEach((b) => {
      const on = b.dataset.day === day;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
    writeHash(state);
    buildMarkers();
    renderDayOverview(day);
  }

  function renderDayOverview(day) {
    const card = document.getElementById('day-overview');
    if (!card) return;
    if (day === 'all' || !daysData) {
      card.classList.remove('show');
      setTimeout(() => { card.hidden = true; }, 300);
      return;
    }
    const dayNum = parseInt(day, 10);
    const d = daysData.days.find((x) => x.day === dayNum);
    if (!d) { card.classList.remove('show'); return; }

    const dateLabel = formatDate(d.date);
    const companions = (daysData.people || []).filter((p) => p.days.includes(dayNum));

    card.innerHTML = `
      <div class="day-head">
        <span class="day-head-title">Day ${d.day} · ${escapeHtml(dateLabel)}</span>
        <button class="day-head-close" aria-label="Close day overview">×</button>
      </div>
      <h3>${escapeHtml(d.title)}</h3>
      ${d.opening_quote ? `<p class="day-quote">&ldquo;${escapeHtml(d.opening_quote)}&rdquo;</p>` : ''}
      <p class="day-summary">${escapeHtml(d.summary)}</p>
      ${d.moments && d.moments.length ? `
        <ul class="day-moments">
          ${d.moments.map((m) => `<li>${escapeHtml(m)}</li>`).join('')}
        </ul>
      ` : ''}
      <div class="day-meta">
        ${(d.themes || []).map((t) => `<span class="theme-chip">${escapeHtml(t)}</span>`).join('')}
        ${companions.map((p) => `<span class="person-chip" title="${escapeAttr(p.notes || p.role || '')}">${escapeHtml(p.name)}</span>`).join('')}
      </div>
      ${dayPhotoCount(dayNum) ? `
        <button class="day-journey-cta" data-day="${dayNum}">
          View day in photos <span class="count">${dayPhotoCount(dayNum)}</span>
        </button>
      ` : ''}
    `;
    card.querySelector('.day-head-close').addEventListener('click', () => setDay('all'));
    const cta = card.querySelector('.day-journey-cta');
    if (cta) cta.addEventListener('click', () => openDayPhotos(dayNum));
    card.hidden = false;
    requestAnimationFrame(() => card.classList.add('show'));
  }

  // ---------- Day photo-journey modal ----------
  function dayPhotoCount(dayNum) {
    let n = 0;
    state.pins.forEach((p) => {
      if (pinDays(p).includes(dayNum)) n += (p.photos || []).length;
    });
    return n;
  }

  function openDayPhotos(dayNum) {
    if (!daysData) return;
    const d = daysData.days.find((x) => x.day === dayNum);
    const title = d ? `Day ${d.day} · ${escapeHtml(d.title)}` : `Day ${dayNum}`;
    const sub = d ? escapeHtml(formatDate(d.date)) : '';

    // Build per-pin sections. Pins ordered by first photo timestamp;
    // within each pin, photos are sorted by timestamp.
    const sections = [];
    let totalPhotos = 0;
    state.pins.forEach((p) => {
      if (!pinDays(p).includes(dayNum)) return;
      const photos = (p.photos || []).map((ph, idx) => ({ ph, idx, time: parsePhotoTime(ph) }));
      if (!photos.length) return;
      photos.sort((a, b) => (a.time || 0) - (b.time || 0));
      const firstTime = photos[0].time || Number.MAX_SAFE_INTEGER;
      const lastTime = photos[photos.length - 1].time || firstTime;
      sections.push({ pin: p, photos, firstTime, lastTime });
      totalPhotos += photos.length;
    });
    sections.sort((a, b) => a.firstTime - b.firstTime);

    const modal = document.getElementById('day-photos-modal');
    document.getElementById('day-photos-title').innerHTML = title;
    document.getElementById('day-photos-sub').textContent = sub + (totalPhotos ? ` · ${totalPhotos} photos · ${sections.length} stops` : '');
    const body = document.getElementById('day-photos-body');
    if (!totalPhotos) {
      body.innerHTML = '<div class="day-photos-empty">No photos on this day yet.</div>';
    } else {
      body.innerHTML = sections.map((sec) => {
        const dotColor = TYPE_COLORS[sec.pin.type] || TYPE_COLORS.default;
        const timeRange = sec.firstTime === sec.lastTime
          ? formatHM(sec.firstTime)
          : `${formatHM(sec.firstTime)}–${formatHM(sec.lastTime)}`;
        return `
          <section class="day-photos-section">
            <header class="day-photos-section-head">
              <span class="type-dot" style="background:${dotColor};"></span>
              <span class="name">${escapeHtml(sec.pin.title || sec.pin.id)}</span>
              <span class="time">${timeRange}</span>
            </header>
            <div class="day-photos-grid">${sec.photos.map((it) => `
              <button class="day-photos-item" data-pin="${escapeAttr(sec.pin.id)}" data-idx="${it.idx}" aria-label="Open photo from ${escapeAttr(sec.pin.title)}">
                <img src="photos/${escapeAttr(it.ph)}" alt="${escapeAttr(sec.pin.title)} — ${formatHM(it.time)}" loading="lazy">
                <div class="day-photos-item-label">${escapeHtml(sec.pin.title || sec.pin.id)}<br>${formatHM(it.time)}</div>
              </button>
            `).join('')}</div>
          </section>
        `;
      }).join('');
      body.querySelectorAll('button[data-pin]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const pin = state.pins.find((p) => p.id === btn.dataset.pin);
          if (!pin) return;
          closeDayPhotos();
          openLightbox(pin, parseInt(btn.dataset.idx, 10));
        });
      });
    }
    modal.hidden = false;
    requestAnimationFrame(() => modal.classList.add('open'));
    document.body.style.overflow = 'hidden';
  }

  function closeDayPhotos() {
    const modal = document.getElementById('day-photos-modal');
    modal.classList.remove('open');
    setTimeout(() => { modal.hidden = true; }, 200);
    if (!els.lightbox.classList.contains('open')) document.body.style.overflow = '';
  }

  function parsePhotoTime(fn) {
    const m = /^(\d{8})_(\d{6})/.exec(fn);
    if (!m) return 0;
    const d = m[1], t = m[2];
    return new Date(
      `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}T${t.slice(0,2)}:${t.slice(2,4)}:${t.slice(4,6)}`
    ).getTime() || 0;
  }
  function formatHM(ts) {
    if (!ts) return '';
    const dt = new Date(ts);
    return dt.toTimeString().slice(0,5);
  }

  function refreshUI() {
    // Sync filter pills
    els.typeFilters.querySelectorAll('button[data-filter]').forEach((b) => {
      const on = b.dataset.filter === state.filter;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
    // Sync day pills
    els.timeline.querySelectorAll('button[data-day]').forEach((b) => {
      const on = b.dataset.day === state.day;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
    // Route toggle
    els.routeToggle.classList.toggle('active', state.routeOn);
    els.routeToggle.setAttribute('aria-pressed', state.routeOn);
  }

  function updateCounts() {
    const all = state.pins.length;
    document.getElementById('ct-all').textContent = all;
    ['shrine', 'food', 'neighborhood', 'hike', 'landmark', 'shop', 'transit'].forEach((t) => {
      const ct = state.pins.filter((p) => p.type === t).length;
      const el = document.getElementById('ct-' + t);
      if (el) el.textContent = ct;
    });
  }

  // ---------- Gallery view ----------
  function getVisiblePhotos() {
    const out = [];
    filteredPins().forEach((pin) => {
      (pin.photos || []).forEach((src, i) => {
        out.push({ src, pinId: pin.id, pinTitle: pin.title, idx: i });
      });
    });
    return out;
  }

  function renderGallery() {
    const gallery = document.getElementById('gallery');
    if (!gallery) return;
    const photos = getVisiblePhotos();

    if (photos.length === 0) {
      gallery.innerHTML = '<div class="gallery-empty"><h3>No photos match this filter</h3><p>Try a different type or day.</p></div>';
      return;
    }

    const items = photos.map((p) => `
      <button class="gallery-item" data-pin="${escapeAttr(p.pinId)}" data-idx="${p.idx}" aria-label="${escapeAttr(p.pinTitle)} — photo ${p.idx + 1}">
        <img src="photos/${escapeAttr(p.src)}" alt="${escapeAttr(p.pinTitle)}" loading="lazy">
        <span class="gallery-item-label">${escapeHtml(p.pinTitle)}</span>
      </button>
    `).join('');

    gallery.innerHTML = `
      <div class="gallery-count">${photos.length} photo${photos.length === 1 ? '' : 's'}</div>
      <div class="gallery-grid">${items}</div>
    `;

    gallery.querySelectorAll('.gallery-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const pin = state.pins.find((p) => p.id === btn.dataset.pin);
        if (!pin) return;
        openLightbox(pin, parseInt(btn.dataset.idx, 10));
      });
    });
  }

  function switchView(view) {
    state.view = view;
    const mapEl = document.getElementById('map');
    const galleryEl = document.getElementById('gallery');
    if (view === 'gallery') {
      mapEl.style.display = 'none';
      galleryEl.hidden = false;
      renderGallery();
    } else {
      galleryEl.hidden = true;
      mapEl.style.display = '';
      setTimeout(() => map.invalidateSize(), 50);
    }
    document.querySelectorAll('button[data-view]').forEach((b) => {
      const on = b.dataset.view === view;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }

  function bindViewToggle() {
    document.querySelectorAll('button[data-view]').forEach((btn) => {
      btn.addEventListener('click', () => switchView(btn.dataset.view));
    });
  }

  function bindModes() {
    document.querySelectorAll('button[data-mode]').forEach((btn) => {
      if (btn.disabled) return;
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        if (!MODE_FILTERS[mode]) return;
        state.mode = mode;
        document.querySelectorAll('button[data-mode]').forEach((b) => {
          const on = b.dataset.mode === mode;
          b.classList.toggle('active', on);
          b.setAttribute('aria-pressed', on);
        });
        buildMarkers();
      });
    });
  }

  function bindStatsChips() {
    document.querySelectorAll('button.stat-chip[data-pin]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const pinId = btn.dataset.pin;
        const pin = state.pins.find((p) => p.id === pinId);
        if (!pin) return;
        // Make sure we're in map view so the pin can be seen
        if (state.view !== 'map') switchView('map');
        openDetail(pinId);
      });
    });
  }

  // ---------- Keyboard / global handlers ----------
  document.addEventListener('keydown', (e) => {
    if (els.lightbox.classList.contains('open')) {
      if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); lbNav(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); lbNav(1); }
      return;
    }
    const dayModal = document.getElementById('day-photos-modal');
    if (dayModal && dayModal.classList.contains('open')) {
      if (e.key === 'Escape') { e.preventDefault(); closeDayPhotos(); }
      return;
    }
    if (e.key === 'Escape' && els.detail.classList.contains('open')) { closeDetail(); return; }
    // Esc also dismisses the day-overview card
    const dayCard = document.getElementById('day-overview');
    if (e.key === 'Escape' && dayCard && dayCard.classList.contains('show')) {
      e.preventDefault();
      setDay('all');
    }
  });

  // Day-overview: swipe-right (or down) to dismiss on mobile
  (function bindDayOverviewGestures() {
    const card = document.getElementById('day-overview');
    if (!card) return;
    let sx = 0, sy = 0, tracking = false;
    card.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    card.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      // Right-swipe > 60px with low vertical drift → dismiss
      if (dx > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) setDay('all');
      // Up-swipe > 60px → dismiss
      else if (dy < -60 && Math.abs(dy) > Math.abs(dx) * 1.5) setDay('all');
    }, { passive: true });
  })();

  els.closeDetail.addEventListener('click', closeDetail);
  els.backToMap.addEventListener('click', closeDetail);
  els.lbClose.addEventListener('click', closeLightbox);
  els.lbPrev.addEventListener('click', () => lbNav(-1));
  els.lbNext.addEventListener('click', () => lbNav(1));
  els.lightbox.addEventListener('click', (e) => { if (e.target === els.lightbox) closeLightbox(); });

  // Day photo-journey modal handlers
  document.getElementById('day-photos-close').addEventListener('click', closeDayPhotos);
  document.getElementById('day-photos-modal').addEventListener('click', (e) => {
    if (e.target.id === 'day-photos-modal') closeDayPhotos();
  });

  // Swipe gesture on the lightbox — horizontal swipe > 50px navigates between photos
  let touchStartX = 0;
  let touchStartY = 0;
  els.lightbox.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  els.lightbox.addEventListener('touchend', (e) => {
    if (!touchStartX) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    touchStartX = 0;
    // Horizontal swipe with low vertical drift → navigate
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      lbNav(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // First-visit hint: show "Swipe ← → to browse" the first time the lightbox opens per device
  const HINT_KEY = 'jp-lightbox-hint-seen';
  function maybeShowHint() {
    if (localStorage.getItem(HINT_KEY)) return;
    els.lbHint.classList.add('show');
    setTimeout(() => els.lbHint.classList.remove('show'), 3000);
    localStorage.setItem(HINT_KEY, '1');
  }

  window.addEventListener('hashchange', () => {
    const h = parseHash();
    let changed = false;
    if (h.filter && h.filter !== state.filter) { state.filter = h.filter; changed = true; }
    if (h.day && h.day !== state.day) { state.day = h.day; changed = true; }
    if (changed) { refreshUI(); buildMarkers(); }
    if (h.pin && h.pin !== state.pin) openDetail(h.pin);
  });

  // ---------- Utilities ----------
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ---------- Load data ----------
  // Days narrative is optional — explorer works without it.
  fetch('days.json').then((r) => r.json()).then((d) => { daysData = d; }).catch(() => { daysData = null; });

  fetch('pins.json')
    .then((r) => r.json())
    .then((data) => {
      state.pins = (data.pins || []).filter((p) => p && p.id);
      if (data.trip) {
        const t = data.trip;
        const sub = $('#trip-subtitle');
        if (sub && t.subtitle) sub.textContent = t.subtitle;
      }

      // Apply initial hash state
      const h = parseHash();
      if (h.filter) state.filter = h.filter;
      if (h.day) state.day = h.day;
      if (h.mode && MODE_FILTERS[h.mode]) {
        state.mode = h.mode;
        document.querySelectorAll('button[data-mode]').forEach((b) => {
          const on = b.dataset.mode === h.mode;
          b.classList.toggle('active', on);
          b.setAttribute('aria-pressed', on);
        });
      }
      updateCounts();
      buildTimeline();
      bindFilters();
      bindViewToggle();
      bindStatsChips();
      bindModes();
      refreshUI();
      buildMarkers();

      // Initial map fit — skip when opening a specific pin directly
      const all = state.pins.filter((p) => p.coords);
      if (all.length && state.filter === 'all' && state.day === 'all' && !h.pin) {
        const bounds = L.latLngBounds(all.map((p) => p.coords));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
      }

      // Open hash pin if requested
      if (h.pin) setTimeout(() => openDetail(h.pin, { fromHash: true }), 400);

      // Hide loading
      els.loading.classList.add('hide');
    })
    .catch((err) => {
      console.error('Failed to load pins.json', err);
      els.loading.innerHTML = '<p style="padding:20px;color:#a00;">Failed to load trip data.</p>';
    });

})();
</script>
